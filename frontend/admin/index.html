<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hans Chapatie - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #451a03,
                #78350f,
                #b45309
            );
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #78350f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #451a03;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #78716c;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #451a03;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #b45309;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #78350f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #451a03;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #78716c;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        HC
    </div>

    <h1>
        Hans Chapatie Centre
    </h1>

    <p class="subtitle">
        Administrator Login
    </p>

    <div
        id="errorMessage"
        class="error"
    ></div>

    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            id="username"
            type="text"
            placeholder="Enter username"
            required
            autocomplete="username"
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>

    </form>

    <div class="footer">
        Hans Chapatie Centre Admin System
    </div>

</div>


<script>

const API_URL = window.location.origin;

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const errorMessage =
    document.getElementById("errorMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";

        loginButton.disabled = true;

        loginButton.textContent = "Logging in...";


        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/auth/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Login failed"
                );

            }


            localStorage.setItem(
                "hans_admin_token",
                data.token
            );


            localStorage.setItem(
                "hans_admin_user",
                JSON.stringify(data.admin)
            );


            window.location.href =
                "dashboard.html";


        } catch (error) {

            errorMessage.textContent =
                error.message;

            errorMessage.style.display =
                "block";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>

</body>

</html>
