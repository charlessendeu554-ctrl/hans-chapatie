services:
  - type: web
    name: hans-chapatie-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hans-chapatie-db
          property: connectionString

databases:
  - name: hans-chapatie-db
    plan: free
